# Serveur média de la LAN ArchiLAN (stories 47.4 et 47.5).
# MediaMTX v1.21.3. Les réglages absents de ce fichier gardent la valeur par défaut de MediaMTX.
# Les valeurs propres à une LAN (adresse de l'API, IP de la machine) viennent de l'environnement :
# MediaMTX lit toute clé en MTX_<CLE_EN_MAJUSCULES>, voir compose.yml et .env.example.

logLevel: info

###############################################
# Autorisation : le site décide qui publie et qui lit.
# À chaque publication et à chaque lecture, MediaMTX envoie en POST à authHTTPAddress un JSON
# {ip, user, password, token, action, path, protocol, id, query, userAgent}.
# Réponse 2xx = accepté, sinon refusé. La clé arrive :
#  - dans `token` pour OBS en WHIP (champ « Jeton Bearer » sans « : ») ;
#  - dans `password` pour SRT (streamid=publish:<chemin>:<pseudo>:<clé>).
# Une lecture (WHEP de l'écran régie) se fait avec le jeton régie de l'événement,
# dans `token` (ou `password` pour la page de lecture intégrée) : un joueur de la
# LAN ne peut pas regarder l'écran d'un autre (v0.66.1).
# Si l'API ne répond pas (Internet coupé), publication et lecture nouvelles sont
# refusées ; un flux déjà ouvert continue, et ses lecteurs aussi.
authMethod: http
authHTTPAddress: https://archilan.fr/api/v1/media-auth
# Actions jamais envoyées au site : l'API de contrôle n'écoute que la machine
# (l'agent de la régie la lit et y coupe les flux refusés).
authHTTPExclude:
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

###############################################
# API de contrôle : lue par l'agent de la régie (story 47.6).
# Seulement sur la machine elle-même.
api: true
apiAddress: 127.0.0.1:9997

###############################################
# Protocoles inutiles ici.
rtsp: false
rtmp: false
hls: false
playback: false
moq: false

###############################################
# WebRTC : publication WHIP (OBS 30+) et lecture WHEP (écran régie).
# HTTPS obligatoire : l'écran régie est une page https://archilan.fr.
webrtc: true
webrtcAddress: :8889
webrtcEncryption: true
webrtcServerKey: /certs/privkey.pem
webrtcServerCert: /certs/fullchain.pem
webrtcAllowOrigins: ['https://archilan.fr', 'https://www.archilan.fr']
# Médias WebRTC en UDP sur ce port (à ouvrir sur la LAN).
webrtcLocalUDPAddress: :8189
# L'IP LAN de la machine est annoncée aux clients (MTX_WEBRTCADDITIONALHOSTS).
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []

###############################################
# SRT : repli pour les encodeurs sans WHIP.
srt: true
srtAddress: :8890

###############################################
# Chemins : un par joueur, `p-` suivi d'un identifiant opaque donné par le site.
# Tout autre chemin est refusé par MediaMTX lui-même.
paths:
  "~^p-[a-z0-9-]{1,40}$":
    source: publisher

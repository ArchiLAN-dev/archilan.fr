doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '17'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Entity'
                prefix: 'App\Identity\Domain\Entity'
            Events:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Events/Domain/Entity'
                prefix: 'App\Events\Domain\Entity'
            GameSelection:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/GameSelection/Domain/Entity'
                prefix: 'App\GameSelection\Domain\Entity'
            Registrations:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Registrations/Domain/Entity'
                prefix: 'App\Registrations\Domain\Entity'
            Payments:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payments/Domain/Entity'
                prefix: 'App\Payments\Domain\Entity'
            Sessions:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Sessions/Domain/Entity'
                prefix: 'App\Sessions\Domain\Entity'
            Content:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Content/Domain/Entity'
                prefix: 'App\Content\Domain\Entity'
            PersonalRuns:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/PersonalRuns/Domain/Entity'
                prefix: 'App\PersonalRuns\Domain\Entity'
            Membership:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Membership/Domain/Entity'
                prefix: 'App\Membership\Domain\Entity'
            WeeklyRuns:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/WeeklyRuns/Domain/Entity'
                prefix: 'App\WeeklyRuns\Domain\Entity'
            SessionConfig:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/SessionConfig/Domain/Entity'
                prefix: 'App\SessionConfig\Domain\Entity'
            Streaming:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Streaming/Domain/Entity'
                prefix: 'App\Streaming\Domain\Entity'
            Community:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Community/Domain/Entity'
                prefix: 'App\Community\Domain\Entity'
            Wallet:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Wallet/Domain/Entity'
                prefix: 'App\Wallet\Domain\Entity'
            Notes:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notes/Domain/Entity'
                prefix: 'App\Notes\Domain\Entity'
            Surveys:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Surveys/Domain/Entity'
                prefix: 'App\Surveys\Domain\Entity'
            Trackers:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Trackers/Domain/Entity'
                prefix: 'App\Trackers\Domain\Entity'
            CatalogSync:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CatalogSync/Domain/Entity'
                prefix: 'App\CatalogSync\Domain\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is set by ParaTest (1..N, one database per worker) or by hand for an isolated run.
            # "TEST_DB_PREFIX" namespaces a whole parallel run, which ParaTest's own TEST_TOKEN would otherwise
            # collide with: two parallel runs on archilan_test1..8 destroy each other's schema.
            dbname_suffix: '_test%env(default::TEST_DB_PREFIX)%%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

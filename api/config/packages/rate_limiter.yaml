framework:
    rate_limiter:
        # Story 9.57: every YAML test is a real generation on the shared runner.
        game_yaml_test:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
        # Story 50.3: the public authentication routes, see AuthRateLimitListener. The per-IP limits stay
        # generous on purpose: a whole LAN event shares one public address.
        auth_login_ip:
            policy: sliding_window
            limit: 100
            interval: '15 minutes'
        auth_login_account:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        auth_password_reset_request:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        auth_password_reset_confirm:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        auth_register:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        auth_resend_confirmation:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

# Tests count in memory, in an unmanaged pool that dies with the container. The client rebuilds the container
# between two requests, so the suite never trips a limit; a test that disables the reboot gets the real ones.
when@test:
    services:
        cache.rate_limiter:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter

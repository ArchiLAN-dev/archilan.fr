framework:
    messenger:
        transports:
            scheduler_default:
                dsn: 'schedule://default'
                # Never retry a scheduled message: a retry sends it back to its transport, and the
                # scheduler transport cannot receive messages - the exception took the whole worker
                # down, async consumption included. A failed task goes to async_failed and runs
                # again at its next slot.
                retry_strategy:
                    max_retries: 0
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: async
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            async_failed:
                dsn: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: async_failed
            run_server:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: run_server
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 2
                    max_delay: 0
        failure_transport: async_failed

        routing:
            'App\Communications\Application\Message\RegistrationConfirmationMessage': async
            'App\Communications\Application\Message\PasswordResetMessage': async
            'App\Communications\Application\Message\EmailConfirmationMessage': async
            'App\Communications\Application\Message\SessionRunningMessage': async
            'App\Events\Application\Message\EventCapacityReachedMessage': async
            'App\Payments\Application\Message\SyncHelloAssoFormMessage': async
            'App\Sessions\Application\Message\FetchLogsJob': run_server
            'App\Sessions\Application\Message\ArchiveRunJob': run_server
            'App\PersonalRuns\Application\Message\LaunchPersonalRunJob': run_server
            'App\PersonalRuns\Application\Message\StopPersonalRunJob': run_server
            'App\Community\Application\Message\RecomputeAchievementsForUserMessage': async
            'App\Community\Application\Message\RecomputeAllAchievementsMessage': async
            # Epic 39: the staff forum and the bot's DMs and sanctions, never in the request that sanctions or writes.
            # A job still failing after its retries is parked in async_failed: `messenger:failed:retry`.
            'App\Community\Application\Message\PostModerationActionToForumJob': async
            'App\Community\Application\Message\PostModerationMessageToForumJob': async
            'App\Community\Application\Message\DeliverStaffReplyJob': async
            # Story 39.9: the Discord passes call Discord; they run on the async worker, never in the scheduler,
            # where they would hold back the other periodic tasks (see 38.5 below).
            'App\Community\Application\Message\PollModerationDirectMessagesMessage': async
            'App\Community\Application\Message\SyncDiscordBansMessage': async
            # Story 41.24: the week's quests told on Discord, out of the hourly quest run.
            'App\Wallet\Application\Message\AnnounceQuestsOnDiscordJob': async
            'App\Community\Application\Message\ExtendDiscordTimeoutsMessage': async
            # Story 38.5 review: the nightly GitHub pass runs on the async worker, not in the scheduler,
            # so the two-minute stuck-run reconciliation is never held up behind it.
            'App\CatalogSync\Application\Message\CheckApworldUpdatesMessage': async
            'App\GameSelection\Application\Message\ReconcileApworldIncidentsMessage': async
            # Story 38.9: the nightly sweep queues its tests from the async worker, not the scheduler.
            'App\GameSelection\Application\Message\SweepApworldCatalogMessage': async
            'App\Identity\Application\Message\SyncDiscordRoleMessage': async
            'App\Identity\Application\Message\CleanupRefreshTokensMessage': async
            'App\Identity\Application\Message\CleanupEmailConfirmationTokensMessage': async
            'App\Identity\Application\Message\CleanupPasswordResetTokensMessage': async
            'App\Payments\Application\Message\CleanupHelloAssoSyncLogMessage': async
            'App\Events\Application\Message\CleanupEventPrivateAccessLogMessage': async
            'App\Membership\Application\Message\ExpireMembershipMessage': async
            'App\Membership\Application\Message\MembershipReminderMessage': async
            'App\Membership\Application\Message\MembershipActivatedNotificationMessage': async
            'App\Membership\Application\Message\MembershipExpiredNotificationMessage': async
            'App\Membership\Application\Message\SyncMemberToDolibarrMessage': async
            'App\Sessions\Application\ScheduledTask\CleanupStaleSessionsTask': async
            'App\Sessions\Application\Message\ResumeRunJob': run_server
            'App\Communications\Application\Message\SessionPausedWithoutSaveMessage': async
            'App\Communications\Application\Message\SessionRestartFailedMessage': async
            'App\Sessions\Application\Message\BuildSessionRecapJob': async
            'App\Sessions\Application\Message\NotifyGenerationFailureJob': async
            # Story 40.1: a slot left a real BK.
            'App\Sessions\Application\Message\NotifySlotUnblockedJob': async
            # Story 40.2: a pushable notification goes to the recipient's devices.
            'App\Community\Application\Message\SendWebPushJob': async
            'App\Community\Application\Message\FriendActivityJob': async
            'App\GameSelection\Application\Message\NotifyApworldIncidentAdminsJob': async
            'App\GameSelection\Application\Message\PostApworldIncidentToStaffChannelJob': async
            'App\GameSelection\Application\Message\PostApworldPromotionToStaffChannelJob': async
            # Story 38.7: runs and registrations bring their not-yet-launched slots along.
            'App\GameSelection\Application\Message\ApworldPromoted': async
            # Story 38.4: a real generation failure is judged off the source's transaction.
            'App\GameSelection\Application\Message\ReportDefaultYamlFailureJob': async
            'App\CatalogSync\Application\Message\SubmitAutoApworldUpdateJob': async
            'App\PersonalRuns\Application\Message\RunSlotPreflightJob': run_server

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                run_server: 'in-memory://'

name: Backend Quality

on:
  # Runs on every PR/push to the integration branch (develop) and prod (main). The workflow always
  # starts so the required "Backend" check is always reported; a path filter (job `changes`) gates the
  # heavy `checks` job to backend changes only, keeping Actions minutes low. This makes the check
  # compatible with branch protection: a PR that doesn't touch api/ is never left blocked on a check
  # that would otherwise be skipped at the workflow level. Use workflow_dispatch to run on demand.
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/backend.yml'

  checks:
    name: Backend checks
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    # NB: single PHP leg on purpose - CI runs the version the prod image ships
    # (php:8.5-cli-alpine since story 33.9 M3); composer.json requires ^8.4,
    # which 8.5 satisfies.
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: archilan
          POSTGRES_PASSWORD: archilan_dev_password
          POSTGRES_DB: archilan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archilan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_pgsql, pgsql, amqp
          coverage: pcov
          tools: composer:v2

      - name: Configure Composer GitHub token
        run: composer config -g github-oauth.github.com ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Validate Composer
        run: composer validate

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # HARD GATE since A5. The backlog it was waiting on (the symfony/yaml low CVE and
      # friends) is cleared - `composer audit` reports no advisories. A supply-chain alarm
      # that cannot fail the build protects nothing, so it now blocks. If a new advisory
      # lands on a dependency, this goes red until it is triaged - that is the job.
      - name: Composer audit (known vulnerabilities)
        run: composer audit

      - name: PHPStan
        run: composer phpstan

      - name: PHP CS Fixer
        run: composer cs-fixer

      - name: Architecture
        run: composer arch

      - name: PHPUnit with coverage
        run: composer test -- --coverage-clover coverage.xml --coverage-html coverage-html

      # Hard gate. Baseline measured at 67.84% (first CI run); floor set just below
      # with margin. Raise MIN over time as coverage grows.
      - name: Coverage floor
        env:
          MIN: '65'
        run: |
          php -r '$x=simplexml_load_file("coverage.xml");$m=$x->project->metrics;$s=(int)$m["statements"];$c=(int)$m["coveredstatements"];$p=$s?100.0*$c/$s:0.0;$min=(float)getenv("MIN");printf("Line coverage: %.2f%% (floor %.0f%%)\n",$p,$min);if($p+1e-9<$min){fwrite(STDERR,sprintf("Coverage %.2f%% is below the %.0f%% floor\n",$p,$min));exit(1);}'

      # Mutation testing (Infection) was RETIRED in story 33.24. Investigation found it measured
      # nothing on this codebase: with PHPUnit 13.1 (migrated in 33.9), Infection 0.34 - documented
      # against PHPUnit 10/11 - hangs the per-mutant test process, so EVERY mutant times out
      # (523/523 on the Community context; persists at 1 thread, a 120s timeout, and
      # --only-covering-test-cases). Infection counts a timeout as "detected", so the MSI it printed
      # (33.12's 72%, 100% on re-measure) was fabricated entirely from timeouts - not one mutant was
      # killed by a test. An advisory step that reports a fictional number and burns CI minutes is
      # the exact "reports into a void" A5 set out to end, so it is gone: config, dev dependency and
      # this step. Re-adopt with a fresh story when Infection ships PHPUnit 13 support (the
      # unit/functional testsuite split it introduced is independent and stays). Full evidence:
      # implementation-artifacts/33-24-infection-timeouts-and-msi-floor.md.

      # HARD GATE since A5, and now also a leg of `composer gates` (local/CI parity, story 33.1).
      # It was advisory from 33.13 until the baseline proved it stays clean between stories -
      # 33.14 and 33.20 finished making that true, and it has been clean since.
      - name: Rector (dry-run)
        run: composer rector

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: api/coverage-html/
          retention-days: 30

  backend:
    # Required status check. Always runs (if: always) so it is always reported to branch protection,
    # and is green when api/ is unchanged (heavy `checks` job skipped) or when the checks pass.
    name: Backend
    needs: [changes, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on backend checks
        run: |
          result="${{ needs.checks.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "Backend checks did not pass (result=$result)"
            exit 1
          fi
          echo "Backend gate OK (api changed: ${{ needs.changes.outputs.api }}; checks: $result)"
